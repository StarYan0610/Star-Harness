[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coding-agent"
version = "0.1.0"
description = "Local coding orchestration agent CLI"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
  "rich>=13.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "SQLAlchemy>=2.0",
  "alembic>=1.13",
  "openai>=1.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
coding-agent = "app.cli.main:app"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
